<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フェルデンクライス英会話トレーナー</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <h1>フェルデンクライス英会話トレーナー</h1>
  <button id="settingsBtn" class="icon-btn" title="APIキー設定" aria-label="設定">⚙</button>
</header>

<nav class="mode-nav">
  <button class="mode-tab active" data-mode="question">① 講師に質問する</button>
  <button class="mode-tab" data-mode="dialogue">② 感覚を伝える</button>
  <button class="mode-tab" data-mode="vocab">③ 語彙</button>
</nav>

<main>

  <!-- モード1: 講師に質問する -->
  <section id="mode-question" class="mode-panel active">
    <p class="progress"><span id="q-progress"></span></p>
    <div class="card">
      <p class="label">伝えたい意図</p>
      <p id="q-jp" class="jp-text"></p>

      <div id="q-answer" class="answer-block hidden">
        <p class="label">英語の模範解答</p>
        <p id="q-en" class="en-text"></p>
        <button id="q-speak" class="btn secondary">🔊 聞く</button>
      </div>
    </div>
    <div class="controls">
      <button id="q-reveal" class="btn primary">英語を表示</button>
      <button id="q-next" class="btn">次へ →</button>
    </div>
  </section>

  <!-- モード2: 感覚を伝える（対話形式） -->
  <section id="mode-dialogue" class="mode-panel">
    <p class="progress"><span id="d-progress"></span></p>

    <div class="card">
      <p class="label">講師の問いかけ</p>
      <p id="d-question-en" class="en-text"></p>
      <button id="d-speak-question" class="btn secondary">🔊 もう一度聞く</button>
    </div>

    <div class="card">
      <p class="label">答えの意図（日本語）</p>
      <p id="d-intent-jp" class="jp-text"></p>
    </div>

    <div class="card mic-card">
      <button id="d-mic" class="btn mic-btn">🎤 話す</button>
      <p id="d-mic-status" class="mic-status"></p>
      <p class="label">認識されたあなたの発話</p>
      <p id="d-transcript" class="en-text transcript"></p>
    </div>

    <div id="d-feedback" class="card feedback-block hidden">
      <p class="label">Claude からのフィードバック</p>
      <div id="d-feedback-loading" class="hidden">評価中です…</div>
      <div id="d-feedback-content"></div>
    </div>

    <div class="controls">
      <button id="d-retry" class="btn">もう一度話す</button>
      <button id="d-next" class="btn primary">次へ →</button>
    </div>
  </section>

  <!-- モード3: 語彙 -->
  <section id="mode-vocab" class="mode-panel">
    <p class="progress"><span id="v-progress"></span></p>
    <div class="card">
      <p class="label">日本語</p>
      <p id="v-jp" class="jp-text"></p>

      <div id="v-answer" class="answer-block hidden">
        <p class="label">英語</p>
        <p id="v-en" class="en-text"></p>
        <button id="v-speak" class="btn secondary">🔊 聞く</button>
      </div>
    </div>
    <div class="controls">
      <button id="v-reveal" class="btn primary">英語を表示</button>
      <button id="v-next" class="btn">次へ →</button>
    </div>
  </section>

</main>

<!-- APIキー設定モーダル -->
<div id="settingsModal" class="modal hidden">
  <div class="modal-content">
    <h2>Claude API キー設定</h2>
    <p class="modal-note">
      キーはこの端末のブラウザ内（localStorage）にのみ保存され、Anthropic の API に直接送信されます。
      コードには保存されません。
    </p>
    <input type="password" id="apiKeyInput" placeholder="sk-ant-...">
    <div class="modal-controls">
      <button id="apiKeySave" class="btn primary">保存</button>
      <button id="apiKeyClear" class="btn">削除</button>
      <button id="apiKeyCancel" class="btn">閉じる</button>
    </div>
    <p id="apiKeyStatus" class="modal-status"></p>
  </div>
</div>

<script src="js/config.js" onerror="console.warn('config.js が見つかりません（任意ファイルです）')"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
